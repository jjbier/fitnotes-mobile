name: EAS Build

# Triggered manually or automatically on version tags (e.g. v1.2.3)
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      platform:
        description: Target platform
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: EAS Build (${{ github.event.inputs.profile || 'production' }} · ${{ github.event.inputs.platform || 'all' }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build
        run: |
          eas build \
            --profile ${{ github.event.inputs.profile || 'production' }} \
            --platform ${{ github.event.inputs.platform || 'all' }} \
            --non-interactive \
            --no-wait

      - name: Build URL
        run: |
          echo "Build queued on EAS. Check progress at:"
          echo "https://expo.dev/accounts/[your-account]/projects/fitnotes-app/builds"
          echo ""
          echo "Required EAS secrets (set once via CLI):"
          echo "  eas secret:create --scope project --name EXPO_PUBLIC_SUPABASE_URL --value '...'"
          echo "  eas secret:create --scope project --name EXPO_PUBLIC_SUPABASE_ANON_KEY --value '...'"
