name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # ── Core: type-check + tests ──────────────────────────────────────────────────
  ci:
    name: Type Check · Test · Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (all packages)
        run: pnpm run type-check

      - name: Test
        run: pnpm run test

  # ── RLS Security Audit ───────────────────────────────────────────────────────
  rls-audit:
    name: RLS Security Audit
    runs-on: ubuntu-latest
    # Only run when DB-related files change
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'db')
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify RLS enabled on all tables
        run: |
          RESULT=$(curl -sf -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_PAT}" \
            -H "Content-Type: application/json" \
            -d '{
              "query": "SELECT tablename, rowsecurity, (SELECT count(*) FROM pg_policies p WHERE p.tablename = t.tablename AND p.schemaname = t.schemaname AND p.cmd = '\''ALL'\'' AND p.qual = '\''(auth.uid() = user_id)'\'') AS correct_policies FROM pg_tables t WHERE t.schemaname = '\''public'\'' AND t.tablename IN (SELECT unnest(ARRAY['\''categories'\'','\''exercises'\'','\''workouts'\'','\''workout_exercises'\'','\''sets'\'','\''personal_records'\'','\''routines'\'','\''routine_days'\'','\''routine_day_exercises'\'','\''predefined_sets'\'','\''body_measurements'\'','\''body_measurement_entries'\'','\''exercise_goals'\''])) ORDER BY tablename"
            }')
          echo "$RESULT" | python3 -c "
          import sys, json
          rows = json.load(sys.stdin)
          failed = [r for r in rows if not r['rowsecurity'] or int(r['correct_policies']) == 0]
          if failed:
              print('FAIL — tables with RLS issues:')
              for r in failed: print(f\"  {r['tablename']}: rls={r['rowsecurity']}, correct_policies={r['correct_policies']}\")
              sys.exit(1)
          print(f'PASS — {len(rows)}/{len(rows)} tables have RLS enabled with correct policy')
          "

      - name: Verify unauthenticated access returns 0 rows
        run: |
          TABLES="workouts exercises categories sets personal_records routines body_measurements"
          FAIL=0
          for TABLE in $TABLES; do
            COUNT=$(curl -sf "${NEXT_PUBLIC_SUPABASE_URL}/rest/v1/${TABLE}?select=id" \
              -H "apikey: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${NEXT_PUBLIC_SUPABASE_ANON_KEY}" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
            if [ "$COUNT" != "0" ]; then
              echo "FAIL — $TABLE returned $COUNT rows without auth"
              FAIL=1
            else
              echo "PASS — $TABLE: 0 rows (anon)"
            fi
          done
          exit $FAIL

  # ── Lint ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

  # ── Coverage: sube a Codecov + badge de nº de tests ───────────────────────────
  # No es un status check requerido — no bloquea merges si falla.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test con cobertura (core + database)
        run: |
          pnpm --filter @fitnotes/core exec vitest run --coverage --reporter=json --outputFile=../../.coverage-core.json
          pnpm --filter @fitnotes/database exec vitest run --coverage --reporter=json --outputFile=../../.coverage-database.json

      - name: Sube cobertura a Codecov
        uses: codecov/codecov-action@v4
        with:
          files: packages/core/coverage/lcov.info,packages/database/coverage/lcov.info
          fail_ci_if_error: false

      - name: Genera badge de nº de tests
        run: |
          python3 -c "
          import json, os
          core = json.load(open('.coverage-core.json'))
          db = json.load(open('.coverage-database.json'))
          passed = core['numPassedTests'] + db['numPassedTests']
          total = core['numTotalTests'] + db['numTotalTests']
          color = 'brightgreen' if passed == total else 'red'
          badge = {'schemaVersion': 1, 'label': 'tests', 'message': f'{passed} passed', 'color': color}
          os.makedirs('.github/badges', exist_ok=True)
          json.dump(badge, open('.github/badges/tests.json', 'w'))
          "
          rm -f .coverage-core.json .coverage-database.json

      - name: Comitea el badge actualizado
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/tests.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: actualiza badge de tests [skip ci]"
            git push
          else
            echo "Sin cambios en el badge, nada que comitear"
          fi
