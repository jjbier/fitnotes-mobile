version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      typescript-eslint:
        patterns: ["@typescript-eslint/*"]
      expo:
        patterns: ["expo", "expo-*", "@expo/*"]
      supabase:
        patterns: ["@supabase/*"]
      tanstack:
        patterns: ["@tanstack/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
